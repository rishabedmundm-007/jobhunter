[project]
name = "jobhunter-infra"
version = "0.1.0"
description = "JobHunter CDK infrastructure"
requires-python = ">=3.12"

dependencies = [
    "aws-cdk-lib>=2.110",
    "constructs>=10.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
